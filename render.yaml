services:
  # Docker runtime (not Render's native Node runtime): the Submit click needs
  # a real OS-level input event (see worker/src/osClick.ts), which needs a
  # real X server to click into - worker/Dockerfile installs Xvfb and runs
  # Chrome headed (HEADLESS=false) against it via xvfb-run. Render's native
  # Node runtime has no apt access to install Xvfb, hence the switch.
  - type: web
    name: ice-report-scraper-worker
    runtime: docker
    plan: free
    rootDir: worker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: TWOCAPTCHA_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_OWNER
        sync: false
      - key: GITHUB_REPO
        sync: false
